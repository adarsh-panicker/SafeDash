<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="50%" stop-color="#0b1328" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Metallic Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="240" rx="20" fill="url(#bgGrad)" stroke="#1a2744" stroke-width="1.5" />

  <!-- Geometric Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#00e5ff" stroke-width="1">
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="160" y1="0" x2="160" y2="240" />
    <line x1="320" y1="0" x2="320" y2="240" />
    <line x1="480" y1="0" x2="480" y2="240" />
    <line x1="640" y1="0" x2="640" y2="240" />
  </g>

  <!-- Left Shield Emblem -->
  <g transform="translate(45, 30)">
    <!-- Outer Shield Bezel -->
    <path d="M 85 10 L 150 40 L 150 115 C 150 155 85 180 85 180 C 85 180 20 155 20 115 L 20 40 Z"
          fill="#0c1427" stroke="url(#shieldGrad)" stroke-width="3.5" filter="url(#neonGlow)" />

    <!-- Inner Shield Carbon Core -->
    <path d="M 85 24 L 138 48 L 138 112 C 138 145 85 166 85 166 C 85 166 32 145 32 112 L 32 48 Z"
          fill="#080d1a" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1.5" />

    <!-- Cluster Speedometer Gauge Sweep Arc inside Shield -->
    <path d="M 50 110 A 38 38 0 1 1 120 110"
          fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="6" stroke-linecap="round" />
    <path d="M 50 110 A 38 38 0 0 1 110 70"
          fill="none" stroke="url(#shieldGrad)" stroke-width="6" stroke-linecap="round" filter="url(#subtleGlow)" />

    <!-- Gauge Needle Pivot -->
    <circle cx="85" cy="100" r="7" fill="#00e5ff" filter="url(#neonGlow)" />
    <line x1="85" y1="100" x2="108" y2="76" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

    <!-- Digital Pulse Tick Marks -->
    <line x1="60" y1="75" x2="66" y2="80" stroke="#00ff88" stroke-width="2" />
    <line x1="85" y1="62" x2="85" y2="70" stroke="#00e5ff" stroke-width="2" />
    <line x1="110" y1="75" x2="104" y2="80" stroke="#ff2244" stroke-width="2" />
  </g>

  <!-- Typography & Wordmark -->
  <g transform="translate(235, 62)">
    <!-- Primary Brand Wordmark -->
    <text x="0" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif"
          font-size="52" font-weight="900" letter-spacing="1.5" fill="#ffffff" filter="url(#subtleGlow)">
      Safe<tspan fill="#00e5ff">Dash</tspan>
    </text>

    <!-- Functional Safety Tagline -->
    <text x="3" y="78" font-family="'SF Mono', 'Consolas', 'Courier New', monospace"
          font-size="13.5" font-weight="700" letter-spacing="3" fill="#94a3b8">
      FAIL-SAFE DIGITAL COCKPIT <tspan fill="#00ff88">•</tspan> BLACKBERRY QNX SDP 8.0
    </text>

    <!-- ASIL-D Certification & Microkernel Pill -->
    <g transform="translate(3, 98)">
      <!-- Badge 1: ASIL-D -->
      <rect x="0" y="0" width="135" height="24" rx="12" fill="rgba(0, 255, 136, 0.12)" stroke="#00ff88" stroke-width="1" />
      <text x="67" y="16" font-family="'SF Mono', monospace" font-size="10.5" font-weight="800" fill="#00ff88" text-anchor="middle">
        ISO 26262 ASIL-D
      </text>

      <!-- Badge 2: QNX Neutrino -->
      <rect x="145" y="0" width="145" height="24" rx="12" fill="rgba(0, 229, 255, 0.12)" stroke="#00e5ff" stroke-width="1" />
      <text x="217" y="16" font-family="'SF Mono', monospace" font-size="10.5" font-weight="800" fill="#00e5ff" text-anchor="middle">
        QNX MICROKERNEL
      </text>

      <!-- Badge 3: 60 FPS Canvas -->
      <rect x="300" y="0" width="115" height="24" rx="12" fill="rgba(187, 68, 255, 0.12)" stroke="#bb44ff" stroke-width="1" />
      <text x="357" y="16" font-family="'SF Mono', monospace" font-size="10.5" font-weight="800" fill="#bb44ff" text-anchor="middle">
        60 FPS HMI
      </text>
    </g>

    <!-- Author Attribution Signature -->
    <text x="3" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="13" font-weight="600" letter-spacing="1.2" fill="#64748b">
      ENGINEERED &amp; DESIGNED BY <tspan fill="#ffffff" font-weight="800">ADARSH PANICKER</tspan>
    </text>
  </g>
</svg>
